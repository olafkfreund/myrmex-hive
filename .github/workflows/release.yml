name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write
  id-token: write # required for Sigstore keyless signing
  packages: write # required to push container images to GHCR

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # server.json advertises an image tag to the public MCP registry. It is
      # hand-bumped, and v1.0.3 shipped with it still saying 1.0.2 — the same
      # drift that has bitten every hand-maintained list in this repo. Catch it
      # at the tag, where it is still free to fix.
      - name: server.json matches the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # packages[].version is deliberately absent: the registry rejects it
          # for OCI packages (the tag in identifier is the version).
          GOT_VERSION=$(jq -r '.version' server.json)
          GOT_IMAGE=$(jq -r '.packages[0].identifier' server.json)
          WANT_IMAGE="ghcr.io/olafkfreund/myrmex-gateway:${VERSION}"
          if [ "$GOT_VERSION" != "$VERSION" ] || [ "$GOT_IMAGE" != "$WANT_IMAGE" ]; then
            echo "::error::server.json is stale for tag ${GITHUB_REF_NAME}."
            echo "  version:    got '${GOT_VERSION}'  want '${VERSION}'"
            echo "  identifier: got '${GOT_IMAGE}'  want '${WANT_IMAGE}'"
            echo "Bump server.json before tagging — see docs/MCP_REGISTRY.md."
            exit 1
          fi
          echo "server.json matches ${GITHUB_REF_NAME}"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A GitHub secret is NOT an env var until it is mapped here. Without
          # this line goreleaser's `isEnvSet "HOMEBREW_TAP_TOKEN"` is false, the
          # cask silently skips, and the release still passes — which is exactly
          # what happened for v1.0.2, v1.0.3 and v1.1.0. The skip was blamed on
          # the secret not existing; in fact the secret was never wired through,
          # so the cask could not have published even once it was set.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      # Chart version AND appVersion both track the git tag, so the chart's
      # image-tag fallback (.Chart.AppVersion) pins the images published above.
      - name: Publish Helm chart to GHCR (OCI)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io \
            -u "${{ github.actor }}" --password-stdin
          helm package charts/myrmex-hive \
            --version "$VERSION" --app-version "$VERSION"
          helm push "myrmex-hive-${VERSION}.tgz" oci://ghcr.io/olafkfreund/charts
