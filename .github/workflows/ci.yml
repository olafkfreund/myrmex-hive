name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Verify Go Format and Lint
        run: |
          go fmt ./...
          go vet ./...

      - name: Run Unit Tests
        run: |
          go test -v ./...

      # The release publishes this chart *after* pushing images, so a broken
      # template would otherwise only surface mid-release.
      - name: Lint Helm chart
        run: |
          helm lint charts/myrmex-hive
          helm template hive charts/myrmex-hive >/dev/null

      # GoReleaser otherwise only runs on a tag, so a config error costs a
      # burned tag and a re-release (it did: v1.0.1 failed because builds
      # pointed `main:` at a single .go file, which silently ignored every
      # other file in the package). A snapshot build catches that on the PR.
      - name: Validate GoReleaser build
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: build --snapshot --clean --single-target

      - name: Install Nix
        uses: cachix/install-nix-action@v26
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Check Nix Flake
        run: nix flake check

      - name: Build via Nix
        run: nix build
