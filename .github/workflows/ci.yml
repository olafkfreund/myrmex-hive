name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Verify Go Format and Lint
        run: |
          go fmt ./...
          go vet ./...

      - name: Run Unit Tests
        run: |
          go test -v ./...

      # The release publishes this chart *after* pushing images, so a broken
      # template would otherwise only surface mid-release.
      - name: Lint Helm chart
        run: |
          helm lint charts/myrmex-hive
          helm template hive charts/myrmex-hive >/dev/null

      # server.json is what the public MCP registry consumes (#102). Validate
      # it against the schema the FILE ITSELF declares, so this catches both a
      # doc that drifted from the schema and a $schema URL that has 404'd —
      # the file previously pointed at a dead 2025-06-18 schema and had never
      # been valid against any live one.
      - name: Validate server.json against the MCP registry schema
        run: |
          pip install --quiet check-jsonschema
          SCHEMA=$(jq -r '."$schema"' server.json)
          echo "server.json declares: $SCHEMA"
          curl -sfI "$SCHEMA" >/dev/null || { echo "::error::\$schema URL is unreachable: $SCHEMA"; exit 1; }
          check-jsonschema --schemafile "$SCHEMA" server.json

      # Terraform is only exercised on a real `apply`, which CI will never do —
      # so validate is the only thing standing between a broken reference and an
      # operator's first deploy (#105). Runs for the module and the example root
      # config; -backend=false keeps init offline and credential-free.
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
          # The wrapper mangles exit codes for later steps; we only need the CLI.
          terraform_wrapper: false

      - name: Validate Terraform
        run: |
          terraform fmt -check -recursive terraform/
          for dir in terraform/modules/aws-gateway terraform/examples/aws; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

      # Backstage renders docs/ via MkDocs (#106). --strict fails on a broken
      # internal link or a dangling nav entry, so docs rot is caught here rather
      # than discovered as a blank Docs tab in the portal.
      #
      # Note --strict does NOT fail when a doc is merely missing from the nav
      # (it is only an INFO line, verified) — TestTechDocsNavCoversEveryDoc in
      # the Go suite covers that direction.
      - name: Build TechDocs
        run: |
          pip install --quiet mkdocs-techdocs-core
          mkdocs build --strict --site-dir /tmp/techdocs

      # GoReleaser otherwise only runs on a tag, so a config error costs a
      # burned tag and a re-release (it did: v1.0.1 failed because builds
      # pointed `main:` at a single .go file, which silently ignored every
      # other file in the package). A snapshot build catches that on the PR.
      - name: Validate GoReleaser build
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: build --snapshot --clean --single-target

      - name: Install Nix
        uses: cachix/install-nix-action@v26
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Check Nix Flake
        run: nix flake check

      - name: Build via Nix
        run: nix build
