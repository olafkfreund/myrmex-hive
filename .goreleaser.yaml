# .goreleaser.yaml
version: 2

project_name: myrmex-hive

before:
  hooks:
    - go mod tidy

builds:
  - id: gateway
    main: ./cmd/gateway
    binary: myrmex-gateway
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - "-s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}"

  - id: agent
    main: ./cmd/agent
    binary: myrmex-agent
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - "-s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}"

  - id: myrmex
    main: ./cmd/myrmex
    binary: myrmex
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - "-s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}"

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: 'checksums.txt'

# Linux .deb/.rpm packages for the three binaries. Packages ship the binary
# only (no bundled config) — gateway_config.json/agent_config.json at the
# repo root are local dev configs (real Tailscale hostnames, example agent
# IDs), not suitable as installed defaults.
# Homebrew tap (#103).
#
# homebrew_casks, NOT brews: `brews` is soft-deprecated since goreleaser v2.10
# and HARD-deprecates in v2.16, and release.yml pins `version: latest` — using
# it would schedule a release failure. Casks are also Homebrew's supported way
# to ship pre-built binaries (the old formulas were, per goreleaser's own
# deprecation note, "hackyish formulas that would install the pre-compiled
# binaries").
#
# Trade-off: casks are macOS-only (Linuxbrew does not support them). Linux
# users have deb/rpm (nfpms above), Nix, install.sh and the GHCR images.
#
# The single `archives` entry has no `ids:` filter, so each tar.gz carries all
# three binaries — one cask installs all three.
#
# The release job's GITHUB_TOKEN is scoped to THIS repo and cannot push to
# olafkfreund/homebrew-myrmex, so pushing the cask needs a HOMEBREW_TAP_TOKEN
# secret (PAT with `repo` scope).
#
# When that secret is absent the cask is SKIPPED rather than failing the
# release: Homebrew is one optional distribution channel, and it should never
# be able to take down the images, chart, packages and binaries with it — an
# expired PAT a year from now would otherwise kill an unrelated release.
# `.Env.X` errors on a missing var, hence envOrDefault/isEnvSet.
#
# Consequence: with no secret set, `brew` silently stays on the previous
# version. GoReleaser logs the skip; check the release log if a new version
# doesn't show up in the tap.
homebrew_casks:
  - name: myrmex-hive
    repository:
      owner: olafkfreund
      name: homebrew-myrmex
      branch: main
      token: '{{ envOrDefault "HOMEBREW_TAP_TOKEN" "" }}'
    binaries:
      - myrmex
      - myrmex-gateway
      - myrmex-agent
    homepage: "https://myrmex-hive.freundcloud.com"
    description: "Zero-inbound-port MCP gateway for managing distributed edge servers over reverse SSH tunnels"
    # "auto" skips prereleases/snapshots; the isEnvSet guard additionally skips
    # when no tap token is configured, so a missing secret degrades instead of
    # failing the release.
    skip_upload: '{{ if isEnvSet "HOMEBREW_TAP_TOKEN" }}auto{{ else }}true{{ end }}'
    caveats: |
      The operator CLI is `myrmex`; it talks to a Gateway's REST API
      (default https://localhost:8080, override with --gateway / MYRMEX_TOKEN).

      myrmex-gateway and myrmex-agent are installed too, but both fail closed:
      neither starts without a config file and Ed25519 keys. See
      https://github.com/olafkfreund/myrmex-hive#3-configuration

nfpms:
  - id: gateway-nfpm
    ids: [gateway]
    package_name: myrmex-gateway
    file_name_template: "myrmex-gateway_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    vendor: olafkfreund
    homepage: https://github.com/olafkfreund/myrmex-hive
    maintainer: "Olaf K Freund <olaf.loken@gmail.com>"
    license: MIT
    description: |-
      Myrmex Hive Gateway: the central SSH tunnel receiver, MCP/REST API,
      and web portal for the Myrmex Hive agent orchestration framework.
    formats:
      - deb
      - rpm
    bindir: /usr/bin

  - id: agent-nfpm
    ids: [agent]
    package_name: myrmex-agent
    file_name_template: "myrmex-agent_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    vendor: olafkfreund
    homepage: https://github.com/olafkfreund/myrmex-hive
    maintainer: "Olaf K Freund <olaf.loken@gmail.com>"
    license: MIT
    description: |-
      Myrmex Hive Agent: dials out to a Myrmex Hive Gateway over SSH and
      exposes system metrics/commands with zero inbound ports.
    formats:
      - deb
      - rpm
    bindir: /usr/bin

  - id: myrmex-nfpm
    ids: [myrmex]
    package_name: myrmex
    file_name_template: "myrmex_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    vendor: olafkfreund
    homepage: https://github.com/olafkfreund/myrmex-hive
    maintainer: "Olaf K Freund <olaf.loken@gmail.com>"
    license: MIT
    description: |-
      Myrmex Hive operator CLI: talks to a Myrmex Hive Gateway's REST API
      to inspect agents, upstreams, and tools, and to invoke tool calls.
    formats:
      - deb
      - rpm
    bindir: /usr/bin

# NOTE: Homebrew (`brews:`) is intentionally NOT configured here — it
# requires a separate homebrew-tap repository (e.g.
# olafkfreund/homebrew-myrmex-hive) that doesn't exist yet, and would fail
# the release step. Follow-up: create the tap repo, then add a `brews:`
# block pointing at it.

# Container images, built from the prebuilt linux binaries (not from
# source) via the goreleaser-* Dockerfiles under Dockerfiles/. amd64 and
# arm64 variant images are pushed separately, then joined into multi-arch
# manifests below so `docker pull ghcr.io/olafkfreund/myrmex-gateway`
# resolves to the right arch automatically.
dockers:
  - id: gateway-amd64
    ids: [gateway]
    goos: linux
    goarch: amd64
    use: buildx
    dockerfile: Dockerfiles/Dockerfile.goreleaser-gateway
    extra_files:
      - assets
    image_templates:
      - "ghcr.io/olafkfreund/myrmex-gateway:{{ .Version }}-amd64"
      - "ghcr.io/olafkfreund/myrmex-gateway:latest-amd64"
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title=myrmex-gateway"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.source={{ .GitURL }}"
      # The MCP registry (#102) verifies OCI ownership by reading this label
      # off the PUBLISHED image and matching it against server.json's `name`.
      # Publishing is rejected without it.
      - "--label=io.modelcontextprotocol.server.name=io.github.olafkfreund/myrmex-hive"

  - id: gateway-arm64
    ids: [gateway]
    goos: linux
    goarch: arm64
    use: buildx
    dockerfile: Dockerfiles/Dockerfile.goreleaser-gateway
    extra_files:
      - assets
    image_templates:
      - "ghcr.io/olafkfreund/myrmex-gateway:{{ .Version }}-arm64"
      - "ghcr.io/olafkfreund/myrmex-gateway:latest-arm64"
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.title=myrmex-gateway"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.source={{ .GitURL }}"
      # The MCP registry (#102) verifies OCI ownership by reading this label
      # off the PUBLISHED image and matching it against server.json's `name`.
      # Publishing is rejected without it.
      - "--label=io.modelcontextprotocol.server.name=io.github.olafkfreund/myrmex-hive"

  - id: agent-amd64
    ids: [agent]
    goos: linux
    goarch: amd64
    use: buildx
    dockerfile: Dockerfiles/Dockerfile.goreleaser-agent
    image_templates:
      - "ghcr.io/olafkfreund/myrmex-agent:{{ .Version }}-amd64"
      - "ghcr.io/olafkfreund/myrmex-agent:latest-amd64"
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title=myrmex-agent"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.source={{ .GitURL }}"

  - id: agent-arm64
    ids: [agent]
    goos: linux
    goarch: arm64
    use: buildx
    dockerfile: Dockerfiles/Dockerfile.goreleaser-agent
    image_templates:
      - "ghcr.io/olafkfreund/myrmex-agent:{{ .Version }}-arm64"
      - "ghcr.io/olafkfreund/myrmex-agent:latest-arm64"
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.title=myrmex-agent"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.source={{ .GitURL }}"

  - id: myrmex-amd64
    ids: [myrmex]
    goos: linux
    goarch: amd64
    use: buildx
    dockerfile: Dockerfiles/Dockerfile.goreleaser-myrmex
    image_templates:
      - "ghcr.io/olafkfreund/myrmex:{{ .Version }}-amd64"
      - "ghcr.io/olafkfreund/myrmex:latest-amd64"
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title=myrmex"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.source={{ .GitURL }}"

  - id: myrmex-arm64
    ids: [myrmex]
    goos: linux
    goarch: arm64
    use: buildx
    dockerfile: Dockerfiles/Dockerfile.goreleaser-myrmex
    image_templates:
      - "ghcr.io/olafkfreund/myrmex:{{ .Version }}-arm64"
      - "ghcr.io/olafkfreund/myrmex:latest-arm64"
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.title=myrmex"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.source={{ .GitURL }}"

docker_manifests:
  - name_template: "ghcr.io/olafkfreund/myrmex-gateway:{{ .Version }}"
    image_templates:
      - "ghcr.io/olafkfreund/myrmex-gateway:{{ .Version }}-amd64"
      - "ghcr.io/olafkfreund/myrmex-gateway:{{ .Version }}-arm64"
  - name_template: "ghcr.io/olafkfreund/myrmex-gateway:latest"
    image_templates:
      - "ghcr.io/olafkfreund/myrmex-gateway:latest-amd64"
      - "ghcr.io/olafkfreund/myrmex-gateway:latest-arm64"
  - name_template: "ghcr.io/olafkfreund/myrmex-agent:{{ .Version }}"
    image_templates:
      - "ghcr.io/olafkfreund/myrmex-agent:{{ .Version }}-amd64"
      - "ghcr.io/olafkfreund/myrmex-agent:{{ .Version }}-arm64"
  - name_template: "ghcr.io/olafkfreund/myrmex-agent:latest"
    image_templates:
      - "ghcr.io/olafkfreund/myrmex-agent:latest-amd64"
      - "ghcr.io/olafkfreund/myrmex-agent:latest-arm64"
  - name_template: "ghcr.io/olafkfreund/myrmex:{{ .Version }}"
    image_templates:
      - "ghcr.io/olafkfreund/myrmex:{{ .Version }}-amd64"
      - "ghcr.io/olafkfreund/myrmex:{{ .Version }}-arm64"
  - name_template: "ghcr.io/olafkfreund/myrmex:latest"
    image_templates:
      - "ghcr.io/olafkfreund/myrmex:latest-amd64"
      - "ghcr.io/olafkfreund/myrmex:latest-arm64"

sboms:
  - id: default
    artifacts: archive
    documents:
      - "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}.sbom.spdx.json"

# Sign the published container images (#120). Until now only the release
# CHECKSUMS were signed (see `signs:` below), so operators pulling
# ghcr.io/olafkfreund/myrmex-* had no way to verify provenance beyond pinning
# a digest.
#
# Two non-obvious settings:
#   - artifacts: all — the DEFAULT is images from `dockers_v2` only, and this
#     config uses `dockers`, so the default would sign NOTHING. "all" covers
#     both the per-arch images and the multi-arch manifests; signing only the
#     per-arch images would leave `cosign verify ghcr.io/.../myrmex-gateway:X`
#     (the plain tag operators actually pull, which resolves to the manifest)
#     with no signature to find.
#   - args — the DEFAULT is key-based (`--key=cosign.key`). These are
#     overridden for Sigstore keyless signing, matching the `signs:` block and
#     the id-token: write permission the release workflow already grants.
docker_signs:
  - id: cosign-images
    cmd: cosign
    artifacts: all
    output: true
    args:
      - "sign"
      - "${artifact}@${digest}"
      - "--yes" # Keyless signing via Sigstore

signs:
  - id: cosign
    cmd: cosign
    args:
      - "sign-blob"
      - "--output-signature"
      - "${signature}"
      - "${artifact}"
      - "--yes" # Keyless signing via Sigstore
    artifacts: checksum
