exclude:
  # Anything not excluded here is COPIED INTO THE PUBLISHED SITE, and any .md
  # with front matter is rendered as a page. That is how 49 vendored Go
  # dependency pages, the internal CLAUDE.md, and unpublished marketing drafts
  # all ended up live on myrmex-hive.freundcloud.com. Adding a directory to the
  # repo? Decide here whether the public site should carry it.
  - vendor          # 23MB of third-party docs; two thirds of the built site
  - CLAUDE.md       # internal agent instructions, not a web page
  - docs/announce   # marketing drafts, also excluded from TechDocs
  - terraform
  - charts
  - dashboards
  - examples
  - result
  - cmd
  - pkg
  - bin
  - Dockerfiles
  - test_env
  - Justfile
  - docker-compose.test.yml
  - generate_keys.sh
  - setup_test_env.sh
  - agent_config.json
  - gateway_config.json
  - go.mod
  - go.sum
  - install.sh
  - install.ps1
  - k8s
  - README.md
