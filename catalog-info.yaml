# Backstage Software Catalog descriptor (#106).
#
# Two entities: the Component (the deployable thing) and the MCP API it
# exposes. The API's definition is $text-inlined from server.json rather than
# copied, so it cannot drift — that file is the public MCP registry manifest and
# is already schema-validated in CI (#102).
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: myrmex-hive
  title: Myrmex Hive
  description: "Zero-inbound-port MCP gateway for managing distributed edge servers over reverse SSH tunnels"
  annotations:
    github.com/project-slug: olafkfreund/myrmex-hive
    # Renders docs/ via MkDocs on the entity's Docs tab. `dir:.` means the
    # mkdocs.yml at the repo root.
    backstage.io/techdocs-ref: dir:.
  tags:
    - go
    - mcp
    - ssh
    - observability
    - security
  links:
    - url: https://myrmex-hive.freundcloud.com
      title: Website
      icon: web
    - url: https://github.com/olafkfreund/myrmex-hive/blob/main/docs/DEPLOYMENT.md
      title: Deployment guide
      icon: docs
    - url: https://github.com/olafkfreund/myrmex-hive/blob/main/docs/OBSERVABILITY.md
      title: Observability (metrics, alerts, tracing)
      icon: dashboard
spec:
  type: service
  lifecycle: production
  owner: olafkfreund
  domain: public
  providesApis:
    - myrmex-mcp
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: myrmex-mcp
  title: Myrmex Hive MCP API
  description: "Model Context Protocol server: agent tools namespaced as <agentID>__<tool>, over stdio, HTTP/SSE and REST"
  annotations:
    github.com/project-slug: olafkfreund/myrmex-hive
  links:
    - url: https://registry.modelcontextprotocol.io
      title: Public MCP registry
      icon: web
spec:
  type: mcp
  lifecycle: production
  owner: olafkfreund
  # Inlined from the repo's server.json — the same manifest published to the
  # public MCP registry, and the one CI validates against the registry schema.
  # Referencing it means this definition cannot drift from the real thing.
  definition:
    $text: ./server.json
