{{- if .Values.gateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "myrmex-hive.gateway.fullname" . }}
  labels:
    {{- include "myrmex-hive.gateway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.gateway.replicaCount }}
  selector:
    matchLabels:
      {{- include "myrmex-hive.gateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.gateway.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "myrmex-hive.gateway.labels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: gateway
          image: {{ include "myrmex-hive.gateway.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: ssh-mcp
              containerPort: {{ .Values.gateway.ports.ssh }}
              protocol: TCP
            - name: http
              containerPort: {{ .Values.gateway.ports.http }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: {{ .Values.gateway.probes.liveness.path }}
              port: http
              scheme: {{ .Values.gateway.probes.liveness.scheme }}
            initialDelaySeconds: {{ .Values.gateway.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.gateway.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.gateway.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.gateway.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.gateway.probes.readiness.path }}
              port: http
              scheme: {{ .Values.gateway.probes.readiness.scheme }}
            initialDelaySeconds: {{ .Values.gateway.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.gateway.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.gateway.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.gateway.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /app/gateway_config.json
              subPath: gateway_config.json
              readOnly: true
            - name: config
              mountPath: /app/secrets/authorized_keys
              subPath: authorized_keys
              readOnly: true
            {{- if .Values.gateway.tls.enabled }}
            - name: tls
              mountPath: /app/secrets/tls
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          secret:
            secretName: {{ .Values.gateway.existingSecret | default (include "myrmex-hive.gateway.fullname" .) }}
        {{- if .Values.gateway.tls.enabled }}
        - name: tls
          secret:
            secretName: {{ .Values.gateway.tls.existingSecret | required "gateway.tls.existingSecret is required when gateway.tls.enabled is true" }}
        {{- end }}
      {{- with .Values.gateway.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gateway.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gateway.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
